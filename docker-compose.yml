version: '3.8'

services:
  headscale:
    build: .
    restart: unless-stopped
    container_name: headscale
    tmpfs:
      - /var/run/headscale
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - headscale_data:/var/lib/headscale
    command: serve -c /etc/headscale/config.yaml
    healthcheck:
      test: ["CMD", "headscale", "health"]

  headplane:
    image: ghcr.io/tale/headplane:latest
    restart: unless-stopped
    container_name: headplane
    ports:
      - "3000:3000"
    volumes:
      - headplane_data:/var/lib/headplane
    environment:
      - COOKIE_SECRET=change_me_to_a_random_string
      - HEADPLANE_LOAD_ENV_OVERRIDES=true
      - HEADPLANE_HEADSCALE__URL=http://headscale:8080
      # You MUST generate an API key on Headscale and replace this value in the Railway Dashboard:
      - HEADPLANE_HEADSCALE__API_KEY=replace_me_in_railway_dashboard

volumes:
  headscale_data:
  headplane_data:
